version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: pyjobby-test-db
    environment:
      POSTGRES_USER: pyjobby_test
      POSTGRES_PASSWORD: pyjobby_test_password
      POSTGRES_DB: pyjobby_test
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"  # Use 5433 to avoid conflict with system postgres
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./priv/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyjobby_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Optional: pgAdmin for database inspection during development
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pyjobby-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pyjobby.test
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-test
    restart: unless-stopped
    profiles:
      - dev  # Only start with --profile dev

volumes:
  postgres-test-data:
    name: pyjobby-test-data
  pgadmin-data:
    name: pyjobby-pgadmin-data
