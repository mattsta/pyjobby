name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYJOBBY_TEST_DSN: postgresql://pyjobby_test:pyjobby_test_password@localhost:5432/pyjobby_test
  # tests/ops spawns the real entry points through the operator's tool
  # runner. Pinned explicitly: this environment is synced by uv, and the
  # runner image may carry a poetry that does not own it.
  PYJOBBY_TOOL_RUNNER: uv run
  # Leak attribution (tests/conftest.py::gc_after_each_test): collect at every
  # teardown so a leaked connection's ResourceWarning fires in the leaking
  # test's own teardown. Without it the unraisable-exception plugin fails
  # whichever innocent test the collector happened to run under, and the name
  # in the report moves from run to run -- which is the same as no report.
  PYJOBBY_GC_EACH_TEST: "1"

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pyjobby_test
          POSTGRES_PASSWORD: pyjobby_test_password
          POSTGRES_DB: pyjobby_test
        ports:
          - 5432:5432
        # the suite creates one database per xdist worker, so the test role
        # needs CREATEDB — it is the superuser here, which covers it
        options: >-
          --health-cmd "pg_isready -U pyjobby_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --locked --group dev

      - name: Lint
        run: |
          uv run ruff check pyjobby/ tests/
          uv run ruff format --check pyjobby/ tests/

      - name: Type check
        run: uv run mypy pyjobby/

      - name: Install schema
        run: uv run pj-admin --dsn "$PYJOBBY_TEST_DSN" db migrate

      - name: Verify a fresh install is usable
        run: uv run pj-admin --dsn "$PYJOBBY_TEST_DSN" doctor

      - name: Tests (parallel, with coverage floor)
        run: |
          uv run pytest -n auto --timeout=300 \
            --cov=pyjobby \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml

      - name: Query plans (the gate that catches a lost index)
        run: uv run pj-bench --dsn "$PYJOBBY_TEST_DSN" plans --force

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Verify the wheel ships every runtime asset
        run: |
          python - <<'PY'
          import glob, zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()

          def packaged(prefix: str, suffix: str) -> set[str]:
              # Keyed by the path BELOW the prefix, not by basename: the admin
              # templates are a subtree (fragments/ inside templates/), and a
              # file that ships under the wrong name is the same 500 at
              # request time as one that does not ship at all.
              return {
                  n[len(prefix):]
                  for n in names
                  if n.startswith(prefix) and n.endswith(suffix)
              }

          # Compare against the source tree rather than a hardcoded name: the
          # schema is a DIRECTORY of ordered files, and an assertion naming
          # one file silently stopped protecting anything when it was split.
          #
          # Every asset the installed code reads at RUNTIME belongs here. The
          # dashboard did not: it lived outside the package, so no install
          # ever had it and the docs told operators to clone the repository
          # instead. "The wheel is missing a runtime asset" is a CI failure,
          # not a bug report.
          for label, source, prefix, suffix in (
              ("base-schema", "pyjobby/sql/schema", "pyjobby/sql/schema/", ".sql"),
              ("dashboard", "pyjobby/static", "pyjobby/static/", ".html"),
              # web_admin.py serves NO html of its own: every page and htmx
              # fragment is one of these files, loaded out of the installed
              # package. A wheel without them is a wheel whose admin UI is
              # nothing but 500s.
              ("admin-template", "pyjobby/templates", "pyjobby/templates/", ".html"),
          ):
              want = {
                  p.relative_to(source).as_posix()
                  for p in Path(source).rglob(f"*{suffix}")
              }
              assert want, f"no {label} files in the source tree ({source})"
              missing = sorted(want - packaged(prefix, suffix))
              assert not missing, f"{wheel} is missing {label} files: {missing}"
              print(f"{wheel}: all {len(want)} {label} file(s) packaged")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
