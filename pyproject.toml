[project]
name = "pyjobby"
version = "2.0.0"
description = "PostgreSQL job platform with a durable execution engine (DXE)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matt Stancliff", email = "matt@genges.com" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Framework :: AsyncIO",
]
dependencies = [
    "orjson>=3.9",
    "click>=8.1",
    "asyncpg>=0.30",
    "loguru>=0.7",
    "aiohttp>=3.9",
    "croniter>=6.2.4",
    "tzdata>=2025.2",
]

[project.urls]
Repository = "https://github.com/mattsta/pyjobby"

[project.scripts]
pj = "pyjobby.pj:workit"
pj-admin = "pyjobby.cli:cli"
pj-web = "pyjobby.web_admin:main"
pj-scheduler = "pyjobby.scheduler:main"
pj-ws = "pyjobby.websocket_server:main"
pj-monitor = "pyjobby.monitor:cli"
pj-bench = "pyjobby.bench:main"

[dependency-groups]
test = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-timeout>=2.2",
    "pytest-xdist>=3.5",
    "pytest-aiohttp>=1.1.0",
    "hypothesis>=6.148.2",
]
dev = [
    { include-group = "test" },
    "mypy>=1.8",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "concurrency: marks tests as concurrency tests",
    "stress: marks tests as stress tests (high load scenarios)",
    "hypothesis: marks tests as property-based tests using Hypothesis",
]
timeout = 300
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["pyjobby"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
# A FLOOR, not a target: it stops coverage from silently rotting. Raise it
# when real behavioral coverage lands; never write tests just to move it.
# (See docs/TESTING.md — this project has shipped 97%-covered modules that
# had no entry point and 99%-covered modules that were total no-ops.)
fail_under = 89
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.14"
pretty = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.ruff]
target-version = "py314"
lint.select = ["I", "FURB", "UP", "C4", "SIM", "F401"]

[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"
