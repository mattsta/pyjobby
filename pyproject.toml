[tool.poetry]
name = "pyjobby"
version = "1.2.3"
description = "PostgreSQL Job Consumer Platform"
authors = ["Matt Stancliff <matt@genges.com>"]

[tool.poetry.dependencies]
python = "^3.10.2"
orjson = "^3.5.0"
click = "^8.0.0"
asyncpg = "^0.30.0"
loguru = "^0.7.3"
aiohttp = "^3.7.3"
croniter = "^6.0.0"
pytz = "^2025.2"

[tool.poetry.scripts]
pj = "pyjobby.pj:workit"
pj-admin = "pyjobby.cli:cli"
pj-web = "pyjobby.web_admin:main"
pj-timeout-monitor = "pyjobby.timeout_monitor:cli"

[tool.poetry.group.test.dependencies]
pytest = "^9.0.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.0.0"
pytest-timeout = "^2.2"
pytest-xdist = "^3.5"
hypothesis = "^6.148.2"

[tool.poetry.group.dev.dependencies]
mypy = "^1.8"
ruff = "^0.14.5"
black = "^25.11.0"
types-orjson = "^3.6"
pytest-aiohttp = "^1.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pyjobby",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "concurrency: marks tests as concurrency tests",
    "stress: marks tests as stress tests (high load scenarios)",
    "hypothesis: marks tests as property-based tests using Hypothesis",
]
timeout = 300
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["pyjobby"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.black]
line-length = 100
target-version = ["py39"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
