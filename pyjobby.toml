# pyjobby configuration (TOML, read as data — never executed).
#
# pj, pj-admin, pj-scheduler, pj-web, pj-ws and pj-bench take this file with
# -c/--config; pj-monitor takes --config ONLY, with no short form and no
# default, so `pj-monitor -c ./pyjobby.toml` is "no such option". And
# JobClient.from_config() reads the same file from application code.
#
# Secrets: any string of the exact form "${ENV_VAR}" is replaced from the
# environment at load time; an unset variable is a loud startup error.

# EVERY TOP-LEVEL SETTING COMES FIRST, before the first [table] header. TOML
# has no way back out to the root: a bare key written after `[db_params]`
# belongs to db_params, so `prio_ceiling` down there is not the deployment's
# ceiling, it is an asyncpg.connect() keyword that does not exist.

# The priority ceiling this deployment's workers run with (`pj --max-prio`).
# Declared once here so every enqueuing surface refuses a job no worker
# would ever claim. LOWER numbers are MORE urgent; default 1000.
prio_ceiling = 1000

# This deployment's APPLICATION code version, for pinning in-flight work to
# matching code across a rolling deploy. Read by both halves of the pin: `pj`
# advertises it (`pj --app-version`) and JobClient.from_config() stamps it on
# every enqueue, so workers and producers cannot disagree about it. Commented
# out = nothing is pinned, which is the default and what most deployments
# want; a job with no app_version is claimed by every worker.
# app_version = "2026.07.28+a1b2c3d"

[db_params]
database = "pyjobby"
user = "postgres"
password = "${PYJOBBY_DB_PASSWORD}"
host = "localhost"
port = 5432

# Experimental per-worker HTTP endpoints (pj workers only). Off by default —
# uncomment to enable; there is no authentication.
# [web_listen]
# sites = [{ host = "127.0.0.1", port = 8080 }]
# paths = []
